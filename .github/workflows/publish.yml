name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists
        id: check-version
        run: |
          PACKAGE_VERSION="${{ steps.package-version.outputs.version }}"
          echo "Current package.json version: $PACKAGE_VERSION"

          # Try to get the published version from npm
          PUBLISHED_VERSION=$(npm view @ampeco/ampeco-ui version --registry=https://registry.npmjs.org 2>/dev/null || echo "none")
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $PACKAGE_VERSION is already published. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION is new. Will publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-version.outputs.should_publish == 'true'
        run: npm test

      - name: Update version (if specified)
        if: steps.check-version.outputs.should_publish == 'true' && github.event.inputs.version != ''
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Build and publish to npm
        if: steps.check-version.outputs.should_publish == 'true'
        run: npm install -g npm@latest && npm run build:lib && npm publish --provenance --access public
